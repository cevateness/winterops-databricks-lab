[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winterops-decision-intelligence"
version = "0.1.0"
description = "Reproducible Databricks learning lab for municipal winter-operations analytics"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["data-engineering", "databricks", "delta-lake", "winter-operations"]
dependencies = ["tzdata; platform_system == 'Windows'"]

[project.optional-dependencies]
geo = ["pyproj>=3.6,<4", "shapely>=2,<3", "pyshp>=2.3,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
winterops = ["sql/*.sql", "templates/*.html"]
