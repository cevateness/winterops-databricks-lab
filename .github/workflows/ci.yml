name: Offline quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local package
        run: python -m pip install -e .
      - name: Unit and notebook contract tests
        run: python -m unittest discover -s tests -v
      - name: Syntax check (no Spark execution)
        run: python -m compileall -q src scripts notebooks
      - name: Aggregate fixture validation
        run: python scripts/validate_quality_snapshot.py data/fixtures/windsor_week_2026_01_12_18_summary.json
